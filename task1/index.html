<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seminar Schedule</title>

    <style>
        table {
            border-collapse: collapse;
            width: 800px;
            margin: 30px auto;
            text-align: center;
            font-size: 18px;
        }

        th, td {
            border: 2px solid #555;
            padding: 12px;
        }

        th {
            font-weight: bold;
        }

        .day {
            width: 120px;
        }

        .begin {
            background-color:red;
        }

        .end-blue {
            background-color: blue;
        }

        .end-green {
            background-color: green;
        }
    </style>
</head>

<body>

<table>

    <tr>
        <th rowspan="3" class="day">Day</th>

        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>


    <tr>
        <td rowspan="2">Monday</td>

        <td class="begin" rowspan="2">8:00 a.m.</td>

        <td class="end-blue" rowspan="2">5:00 p.m.</td>

        <td >
            Introduction to XML
        </td>
        <tr>
    <td>Validity: DTD and Relax NG</td>
</tr>

    </tr>


    <tr>
        <td rowspan="3">Tuesday</td>

        <td class="begin">8:00 a.m.</td>

        <td class="begin">11:00 a.m.</td>

        <td rowspan="1">XPath</td>
    </tr>

    <tr>
        <td class="begin">11:00 a.m.</td>

        <td class="end-green">2:00 p.m.</td>

        <td rowspan="2">XSL Transformations</td>
    </tr>

    <tr>
        <td class="begin">2:00 p.m.</td>

        <td class="end-blue">5:00 p.m.</td>
    </tr>


    <tr>
        <td>Wednesday</td>

        <td class="begin">8:00 a.m.</td>

        <td class="end-green">12:00 p.m.</td>

        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
