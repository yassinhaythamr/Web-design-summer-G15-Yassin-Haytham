<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="team-section">
        <div class="team-container">
            <div class="team-card">
                <img src="images/person1.jpg" alt="Alex Smith">
                <div class="team-info">
                    <h2>Alex Smith</h2>
                    <p>Web Developer</p>
                </div>
            </div>

            <div class="team-card">
                <img src="images/person2.jpg" alt="Dolly Seth">
                <div class="team-info">
                    <h2>Dolly Seth</h2>
                    <p>Digital Marketing</p>
                </div>
            </div>

            <div class="team-card">
                <img src="images/person3.jpg" alt="John Carter">
                <div class="team-info">
                    <h2>John Carter</h2>
                    <p>UI Designer</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
